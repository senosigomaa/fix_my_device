name: fix_my_device
description: "A new Flutter project for home appliance maintenance services."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # دعم اللغة العربية والاتجاه من اليمين لليسار (RTL)
  flutter_localizations:
    sdk: flutter

  # خط Cairo للواجهة العربية العصرية
  google_fonts: ^6.2.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
